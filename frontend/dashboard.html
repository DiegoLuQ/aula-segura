<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Aula Segura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { display: none; }
        .table-container { width: 100% !important; max-width: 100vw; overflow-x: auto; }
        table { width: 100%; min-width: 1000px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <script>
        const API_URL = window.location.origin.includes('127.0.0.1') || window.location.origin.includes('localhost') || window.location.origin.startsWith('file://')
            ? 'http://127.0.0.1:8000'
            : window.location.origin + '/api';

        (async function() {
            const token = localStorage.getItem('token');
            if (!token) window.location.href = 'index.html';
            const resp = await fetch(`${API_URL}/me`, { headers: { 'Authorization': `Bearer ${token}` }});
            if (!resp.ok) window.location.href = 'index.html';
            document.body.style.display = 'block';
        })();
    </script>
    
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold text-indigo-900">Aula Segura</h1>
            <span id="user-role-badge" class="px-2 py-1 bg-indigo-100 text-indigo-700 text-xs font-bold rounded uppercase"></span>
        </div>
        <nav class="flex gap-4">
            <a href="dashboard.html" class="text-indigo-600 font-bold border-b-2 border-indigo-600 pb-1">Registros</a>
            <a href="otras_medidas.html" class="text-slate-500 hover:text-indigo-600 transition">Otras Medidas</a>
            <a href="upload.html" id="nav-upload" class="hidden text-slate-500 hover:text-indigo-600 transition">Subir Excel</a>
            <a href="admin.html" id="nav-admin" class="hidden text-slate-500 hover:text-indigo-600 transition">Usuarios</a>
        </nav>
        <div class="flex items-center gap-6">
            <div class="flex flex-col items-end">
                <span id="user-info" class="text-sm font-medium text-slate-600"></span>
                <button onclick="openPassModal()" class="text-[10px] text-indigo-500 hover:underline">Cambiar Clave</button>
            </div>
            <button onclick="logout()" class="text-slate-400 hover:text-red-600 transition">Salir</button>
        </div>
    </header>

    <main class="p-4 lg:p-6 w-full">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
            <div>
                <h2 class="text-2xl font-bold">Listado de Alumnos</h2>
                <p class="text-slate-500">Gestión de procesos de Aula Segura</p>
            </div>
            <div id="lawyer-actions" class="hidden flex flex-wrap gap-3 justify-end">
                <div class="relative">
                    <button onclick="toggleColumnsDropdown(event)" class="bg-white text-slate-700 px-4 py-2 rounded-lg font-bold hover:bg-slate-50 transition border border-slate-200">
                        ⚙ Columnas
                    </button>
                    <div id="columns-dropdown" class="absolute right-0 top-full mt-2 w-64 bg-white border rounded-xl shadow-xl p-4 hidden z-[60]">
                        <h4 class="text-xs font-bold text-slate-400 uppercase mb-3">Mostrar Columnas</h4>
                        <div id="column-toggles" class="space-y-2 max-h-64 overflow-y-auto text-sm">
                            <!-- Checkboxes dinámicos -->
                        </div>
                    </div>
                </div>
                <button onclick="window.location.href='upload.html'" class="bg-indigo-50 text-indigo-700 px-4 py-2 rounded-lg font-bold hover:bg-indigo-100 transition border border-indigo-200">
                    ⬆ Carga Masiva
                </button>
                <button onclick="window.location.href='registro.html'" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-indigo-700 transition shadow-lg">
                    + Agregar Alumno
                </button>
            </div>
        </div>

        <!-- FILTROS -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Buscar (Nombre o RUT)</label>
                <input type="text" id="filter-search" oninput="applyFilters()" placeholder="Ej: Juan Perez..." class="w-full px-4 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Año</label>
                <select id="filter-year" onchange="applyFilters()" class="w-full px-4 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="">Todos</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Colegio</label>
                <select id="filter-colegio" onchange="applyFilters()" class="w-full px-4 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="">Todos los colegios</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Desde</label>
                <input type="date" id="filter-date-from" onchange="applyFilters()" class="w-full px-4 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Hasta</label>
                <input type="date" id="filter-date-to" onchange="applyFilters()" class="w-full px-4 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden w-full">
            <div class="table-container">
                <table id="main-table" class="text-sm">
                    <thead>
                        <tr id="table-header" class="bg-indigo-50 text-indigo-700 uppercase text-xs">
                            <!-- Header dinámico -->
                        </tr>
                    </thead>
                    <tbody id="students-table-body" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
            <div id="loading-state" class="p-10 text-center text-slate-400">Cargando...</div>
        </div>
    </main>

    <!-- MODAL CAMBIO CONTRASEÑA -->
    <div id="modal-pass" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
            <h3 class="text-xl font-bold text-indigo-900 mb-4">Cambiar Contraseña</h3>
            <form id="pass-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Contraseña Actual</label>
                    <input type="password" id="p-old" required class="w-full px-4 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Nueva Contraseña</label>
                    <input type="password" id="p-new" required class="w-full px-4 py-2 border rounded-lg">
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closePassModal()" class="px-4 py-2 text-slate-500">Cancelar</button>
                    <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold">Actualizar</button>
                </div>
            </form>
            <p id="pass-msg" class="mt-4 text-sm text-center hidden"></p>
        </div>
    </div>

    <script>
        let currentUser = null;
        let studentsData = [];

        const ALL_COLUMNS = [
            { id: 'rut', label: 'RUT', default: true },
            { id: 'nombre_estudiante', label: 'NOMBRE<br>ESTUDIANTE', default: true },
            { id: 'curso', label: 'CURSO', default: true },
            { id: 'causa', label: 'CAUSA', default: false },
            { id: 'fecha_inicio_proceso', label: 'FECHA INICIO PROCESO<br>AULA SEGURA', default: true },
            { id: 'descargos', label: 'DESCARGOS', default: false },
            { id: 'fecha_descargados', label: 'FECHA<br>DESCARGADOS', default: false },
            { id: 'fecha_notificacion_medida', label: 'FECHA NOTIFICACIÓN<br>MEDIDA', default: false },
            { id: 'fecha_recepcion_apelacion', label: 'FECHA RECEPCIÓN<br>CARTA APELACIÓN', default: false },
            { id: 'fecha_consejo_profesores', label: 'FECHA CONSEJO<br>PROFESORES', default: false },
            { id: 'fecha_notificacion_final', label: 'FECHA NOTIFICACIÓN<br>FINAL "MEDIDA"', default: false },
            { id: 'fecha_envio_sie', label: 'FECHA ENVÍO DE<br>ANTECEDENTES SIE', default: true },
            { id: 'resultado_revision', label: 'RESULTADO REVISIÓN<br>EXPEDIENTE', default: true },
            { id: 'medida', label: 'MEDIDA', default: true },
            { id: 'acciones', label: 'ACCIONES', default: true }
        ];

        let visibleColumns = JSON.parse(localStorage.getItem('visible_columns')) || 
                             ALL_COLUMNS.filter(c => c.default).map(c => c.id);

        // Asegurar que el orden inicial sea el correcto según ALL_COLUMNS
        visibleColumns.sort((a, b) => {
            const indexA = ALL_COLUMNS.findIndex(c => c.id === a);
            const indexB = ALL_COLUMNS.findIndex(c => c.id === b);
            return indexA - indexB;
        });

        async function init() {
            const token = localStorage.getItem('token');
            if (!token) window.location.href = 'login.html';

            const resp = await fetch(`${API_URL}/me`, { headers: { 'Authorization': `Bearer ${token}` }});
            if (!resp.ok) logout();
            
            currentUser = await resp.json();
            document.getElementById('user-info').innerText = currentUser.nombre;
            document.getElementById('user-role-badge').innerText = currentUser.rol;
            
            if (currentUser.rol === 'lawyer' || currentUser.rol === 'admin') {
                document.getElementById('nav-upload').classList.remove('hidden');
                document.getElementById('lawyer-actions').classList.remove('hidden');
                setupColumnToggles();
                
                // Filtro por año actual por defecto para Lawyer/Admin
                const currentYear = new Date().getFullYear();
                document.getElementById('filter-year').value = currentYear;
                
                if (currentUser.rol === 'admin') {
                    document.getElementById('nav-admin').classList.remove('hidden');
                }
            } else if (currentUser.rol === 'super_viewer') {
                // Super Viewer ve solo columnas básicas
                visibleColumns = ['rut', 'nombre_estudiante', 'curso', 'fecha_inicio_proceso', 'fecha_envio_sie', 'medida'];
            } else {
                // Viewer normal ve solo columnas básicas
                visibleColumns = ['rut', 'nombre_estudiante', 'curso', 'fecha_inicio_proceso', 'fecha_envio_sie', 'medida'];
            }
            setupYearSelect();
            await loadColegios();
            loadStudents();
        }

        function setupYearSelect() {
            const select = document.getElementById('filter-year');
            for (let year = 2024; year <= 2035; year++) {
                const opt = document.createElement('option');
                opt.value = year;
                opt.innerText = year;
                select.appendChild(opt);
            }
        }

        async function loadColegios() {
            const resp = await fetch(`${API_URL}/colegios`);
            const colegios = await resp.json();
            const select = document.getElementById('filter-colegio');
            select.innerHTML += colegios.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
        }

        function setupColumnToggles() {
            const container = document.getElementById('column-toggles');
            container.innerHTML = ALL_COLUMNS.map(col => `
                <label class="flex items-center gap-2 cursor-pointer hover:bg-slate-50 p-1 rounded">
                    <input type="checkbox" value="${col.id}" ${visibleColumns.includes(col.id) ? 'checked' : ''} 
                           onchange="toggleColumn('${col.id}')" class="rounded text-indigo-600">
                    <span>${col.label}</span>
                </label>
            `).join('');
        }

        function toggleColumn(columnId) {
            if (visibleColumns.includes(columnId)) {
                visibleColumns = visibleColumns.filter(id => id !== columnId);
            } else {
                visibleColumns.push(columnId);
            }
            // Mantener el orden estático de las columnas según ALL_COLUMNS
            visibleColumns.sort((a, b) => {
                const indexA = ALL_COLUMNS.findIndex(c => c.id === a);
                const indexB = ALL_COLUMNS.findIndex(c => c.id === b);
                return indexA - indexB;
            });
            localStorage.setItem('visible_columns', JSON.stringify(visibleColumns));
            renderTable();
        }

        function openPassModal() { document.getElementById('modal-pass').classList.remove('hidden'); }

        function closePassModal() { 
            document.getElementById('modal-pass').classList.add('hidden');
            document.getElementById('pass-msg').classList.add('hidden');
            document.getElementById('pass-form').reset();
        }

        function toggleColumnsDropdown(e) {
            e.stopPropagation();
            document.getElementById('columns-dropdown').classList.toggle('hidden');
        }

        window.addEventListener('click', function(event) {
            const dropdown = document.getElementById('columns-dropdown');
            if (dropdown && !dropdown.contains(event.target)) {
                dropdown.classList.add('hidden');
            }
        });

        document.getElementById('pass-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('token');
            const old_password = document.getElementById('p-old').value;
            const new_password = document.getElementById('p-new').value;
            const msg = document.getElementById('pass-msg');

            const resp = await fetch(`${API_URL}/change-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ old_password, new_password })
            });

            msg.classList.remove('hidden');
            if (resp.ok) {
                msg.className = 'mt-4 text-sm text-center text-green-600';
                msg.innerText = 'Contraseña cambiada con éxito';
                setTimeout(closePassModal, 2000);
            } else {
                const err = await resp.json();
                msg.className = 'mt-4 text-sm text-center text-red-600';
                msg.innerText = err.detail || 'Error al cambiar contraseña';
            }
        });

        async function loadStudents() {
            const token = localStorage.getItem('token');
            const loading = document.getElementById('loading-state');

            const resp = await fetch(`${API_URL}/estudiantes`, { headers: { 'Authorization': `Bearer ${token}` }});
            studentsData = await resp.json();
            
            loading.classList.add('hidden');
            applyFilters();
        }

        function applyFilters() {
            const search = document.getElementById('filter-search').value.toLowerCase();
            const year = document.getElementById('filter-year').value;
            const colegioId = document.getElementById('filter-colegio').value;
            const dateFrom = document.getElementById('filter-date-from').value;
            const dateTo = document.getElementById('filter-date-to').value;

            const filtered = studentsData.filter(s => {
                const matchSearch = !search || 
                    (s.nombre_estudiante && s.nombre_estudiante.toLowerCase().includes(search)) ||
                    (s.rut && s.rut.toLowerCase().includes(search));
                
                const sDateStr = s.fecha_inicio_proceso;
                const matchYear = !year || (sDateStr && sDateStr.startsWith(year));
                
                const matchColegio = !colegioId || s.id_colegio == colegioId;
                
                const matchDateFrom = !dateFrom || (sDateStr && sDateStr >= dateFrom);
                const matchDateTo = !dateTo || (sDateStr && sDateStr <= dateTo);

                return matchSearch && matchYear && matchColegio && matchDateFrom && matchDateTo;
            });

            renderTable(filtered);
        }

        function renderTable(data = studentsData) {
            const headerRow = document.getElementById('table-header');
            const tbody = document.getElementById('students-table-body');
            
            // Render Header
            headerRow.innerHTML = visibleColumns.map(colId => {
                const col = ALL_COLUMNS.find(c => c.id === colId);
                return `<th class="px-4 py-3 text-left text-[10px] leading-tight font-bold text-indigo-900 uppercase">${col.label}</th>`;
            }).join('');

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${visibleColumns.length}" class="p-10 text-center text-slate-400 italic">No se encontraron registros con los filtros aplicados.</td></tr>`;
                return;
            }

            // Render Body
            tbody.innerHTML = data.map(s => {
                let rowHtml = '<tr class="hover:bg-slate-50 transition">';
                visibleColumns.forEach(colId => {
                    let content = s[colId] || '-';
                    if (typeof content === 'string' && /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(content.trim())) {
                        content = content.trim().split(' ')[0];
                    }
                    let css = 'px-4 py-4 text-slate-500';
                    
                    if (colId === 'rut') css += ' font-mono text-xs';
                    if (colId === 'nombre_estudiante') css = 'px-4 py-4 font-medium text-indigo-900';
                    if (colId === 'medida') {
                        content = `<span class="px-2 py-1 ${content === 'EXPULSIÓN' ? 'bg-red-50 text-red-700' : 'bg-amber-50 text-amber-700'} text-[10px] font-bold rounded">${content}</span>`;
                    }
                    if (colId === 'causa' || colId === 'resultado_revision') {
                        css += ' min-w-[250px] max-w-md text-xs';
                    }
                    if (colId === 'acciones') {
                        css = 'px-4 py-4 text-right flex gap-2 justify-end items-center';
                        content = `
                        <a href="detalles.html?id=${s.id}" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-50 text-slate-700 hover:bg-slate-200 rounded-lg font-bold text-xs transition-all shadow-sm border border-slate-200">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            Ver
                        </a>
                        <a href="registro.html?id=${s.id}" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-indigo-50 text-indigo-700 hover:bg-indigo-600 hover:text-white rounded-lg font-bold text-xs transition-all shadow-sm border border-indigo-100">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                            Editar
                        </a>`;
                        
                        if (currentUser && currentUser.rol === 'lawyer') {
                            content += `<button onclick="deleteStudent(${s.id})" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-red-50 text-red-600 hover:bg-red-600 hover:text-white rounded-lg font-bold text-xs transition-all shadow-sm border border-red-100">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                Eliminar
                            </button>`;
                        }
                    }
                    if (colId === 'descargos') {
                        css += ' max-w-xs truncate';
                    }

                    rowHtml += `<td class="${css}">${content}</td>`;
                });
                rowHtml += '</tr>';
                return rowHtml;
            }).join('');
        }

        async function deleteStudent(id) {
            if (!confirm('¿Está seguro de que desea eliminar este registro? Esta acción no se puede deshacer.')) return;
            
            const token = localStorage.getItem('token');
            try {
                const resp = await fetch(`${API_URL}/estudiantes/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (resp.ok) {
                    loadStudents();
                } else {
                    const err = await resp.json();
                    alert(err.detail || 'Error al eliminar el registro');
                }
            } catch (e) {
                alert('Error de conexión');
            }
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }

        init();
    </script>
</body>
</html>
