<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Aula Segura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { display: none; }</style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <script>
        const API_URL = window.location.origin.includes('127.0.0.1') || window.location.origin.includes('localhost') || window.location.origin.startsWith('file://')
            ? 'http://127.0.0.1:8000'
            : window.location.origin + '/api';

        (async function() {
            const token = localStorage.getItem('token');
            if (!token) window.location.href = 'index.html';
            const resp = await fetch(`${API_URL}/me`, { headers: { 'Authorization': `Bearer ${token}` }});
            if (!resp.ok) { window.location.href = 'index.html'; return; }
            const user = await resp.json();
            if (user.rol !== 'admin') { window.location.href = 'dashboard.html'; return; }
            document.body.style.display = 'block';
        })();
    </script>
    
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold text-indigo-900">Aula Segura</h1>
            <span class="px-2 py-1 bg-red-100 text-red-700 text-xs font-bold rounded uppercase">Admin</span>
        </div>
        <nav class="flex gap-4">
            <a href="dashboard.html" class="text-slate-500 hover:text-indigo-600 transition">Registros</a>
            <a href="otras_medidas.html" class="text-slate-500 hover:text-indigo-600 transition">Otras Medidas</a>
            <a href="admin.html" class="text-indigo-600 font-bold border-b-2 border-indigo-600 pb-1">Usuarios</a>
        </nav>
        <div class="flex items-center gap-6">
            <span id="user-info" class="text-sm font-medium text-slate-600"></span>
            <button onclick="logout()" class="text-slate-400 hover:text-red-600 transition">Salir</button>
        </div>
    </header>

    <main class="p-6 lg:p-10 max-w-6xl mx-auto w-full">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-2xl font-bold">Gestión de Usuarios</h2>
                <p class="text-slate-500">Administre los accesos y roles del sistema.</p>
            </div>
            <button onclick="openUserModal()" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-indigo-700 transition shadow-lg">
                + Nuevo Usuario
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <table class="w-full text-sm">
                <thead>
                    <tr class="bg-slate-50 text-slate-500 uppercase text-xs">
                        <th class="px-6 py-3 text-left">Usuario</th>
                        <th class="px-6 py-3 text-left">Rol</th>
                        <th class="px-6 py-3 text-left">Colegio</th>
                        <th class="px-6 py-3 text-left">Estado</th>
                        <th class="px-6 py-3 text-right">Acciones</th>
                    </tr>
                </thead>
                <tbody id="users-table-body" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </main>

    <!-- MODAL USUARIO -->
    <div id="modal-user" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md border border-slate-200">
            <div class="p-6 border-b flex justify-between items-center">
                <h3 class="text-xl font-bold text-indigo-900" id="modal-title">Nuevo Usuario</h3>
                <button onclick="closeUserModal()" class="text-slate-400">✕</button>
            </div>
            <form id="user-form" class="p-6 space-y-4">
                <input type="hidden" id="u-id">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Nombre de Usuario</label>
                    <input type="text" id="u-nombre" required class="w-full px-4 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Contraseña (Dejar vacío para mantener)</label>
                    <input type="password" id="u-clave" class="w-full px-4 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Rol</label>
                    <select id="u-rol" required class="w-full px-4 py-2 border rounded-lg"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Colegio Asignado</label>
                    <select id="u-colegio" required class="w-full px-4 py-2 border rounded-lg"></select>
                </div>
                <div id="status-container" class="hidden">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="u-estado" class="rounded text-indigo-600">
                        <span class="text-sm text-slate-600">Usuario Activo</span>
                    </label>
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeUserModal()" class="px-4 py-2 text-slate-500">Cancelar</button>
                    <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // API_URL ya definida arriba
        let roles = [];
        let colegios = [];
        let usersList = [];

        async function init() {
            const token = localStorage.getItem('token');
            if (!token) window.location.href = 'index.html';
            
            const resp = await fetch(`${API_URL}/me`, { headers: { 'Authorization': `Bearer ${token}` }});
            const user = await resp.json();
            if (user.rol !== 'admin') window.location.href = 'dashboard.html';
            
            document.getElementById('user-info').innerText = user.nombre;
            
            await loadMetadata();
            loadUsers();
        }

        async function loadMetadata() {
            const [rResp, cResp] = await Promise.all([
                fetch(`${API_URL}/roles`),
                fetch(`${API_URL}/colegios`)
            ]);
            roles = await rResp.json();
            colegios = await cResp.json();

            document.getElementById('u-rol').innerHTML = roles.map(r => `<option value="${r.id}">${r.rol}</option>`).join('');
            document.getElementById('u-colegio').innerHTML = colegios.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
        }

        async function loadUsers() {
            const token = localStorage.getItem('token');
            const resp = await fetch(`${API_URL}/admin/users`, { headers: { 'Authorization': `Bearer ${token}` }});
            usersList = await resp.json();
            
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = usersList.map(u => {
                const rol = roles.find(r => r.id === u.id_rol)?.rol || 'N/A';
                const col = colegios.find(c => c.id === u.id_colegio)?.nombre || 'N/A';
                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="px-6 py-4 font-medium text-slate-900">${u.nombre}</td>
                        <td class="px-6 py-4 uppercase text-xs font-bold text-slate-500">${rol}</td>
                        <td class="px-6 py-4 text-slate-500">${col}</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 ${u.estado ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} text-[10px] font-bold rounded uppercase">
                                ${u.estado ? 'Activo' : 'Inactivo'}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <button onclick="editUser(${u.id})" class="text-indigo-600 hover:underline font-bold">Editar</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function openUserModal() {
            document.getElementById('modal-title').innerText = 'Nuevo Usuario';
            document.getElementById('user-form').reset();
            document.getElementById('u-id').value = '';
            document.getElementById('status-container').classList.add('hidden');
            document.getElementById('modal-user').classList.remove('hidden');
        }

        function editUser(id) {
            const user = usersList.find(u => u.id === id);
            if (!user) return;
            document.getElementById('modal-title').innerText = 'Editar Usuario';
            document.getElementById('u-id').value = user.id;
            document.getElementById('u-nombre').value = user.nombre;
            document.getElementById('u-clave').value = '';
            document.getElementById('u-rol').value = user.id_rol;
            document.getElementById('u-colegio').value = user.id_colegio;
            document.getElementById('u-estado').checked = user.estado;
            document.getElementById('status-container').classList.remove('hidden');
            document.getElementById('modal-user').classList.remove('hidden');
        }

        function closeUserModal() {
            document.getElementById('modal-user').classList.add('hidden');
        }

        document.getElementById('user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('token');
            const id = document.getElementById('u-id').value;
            const payload = {
                nombre: document.getElementById('u-nombre').value,
                id_rol: parseInt(document.getElementById('u-rol').value),
                id_colegio: parseInt(document.getElementById('u-colegio').value)
            };

            const clave = document.getElementById('u-clave').value;
            if (clave) payload.clave = clave;
            if (id) payload.estado = document.getElementById('u-estado').checked;

            const url = id ? `${API_URL}/admin/users/${id}` : `${API_URL}/admin/users`;
            const method = id ? 'PUT' : 'POST';

            const resp = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(payload)
            });

            if (resp.ok) {
                closeUserModal();
                loadUsers();
            } else {
                const err = await resp.json();
                alert(err.detail || 'Error al guardar usuario');
            }
        });

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        }

        init();
    </script>
</body>
</html>
