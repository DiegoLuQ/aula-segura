<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Otra Medida - Aula Segura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { display: none; }</style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <script>
        const API_URL = window.location.origin.includes('127.0.0.1') || window.location.origin.includes('localhost') || window.location.origin.startsWith('file://')
            ? 'http://127.0.0.1:8000'
            : window.location.origin + '/api';

        (async function() {
            const token = localStorage.getItem('token');
            if (!token) window.location.href = 'index.html';
            const resp = await fetch(`${API_URL}/me`, { headers: { 'Authorization': `Bearer ${token}` }});
            if (!resp.ok) window.location.href = 'index.html';
            document.body.style.display = 'block';
        })();
    </script>

    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold text-indigo-900">Aula Segura</h1>
        <nav class="flex gap-4">
            <a href="dashboard.html" class="text-slate-500 hover:text-indigo-600 transition">Registros</a>
            <a href="otras_medidas.html" class="text-slate-500 hover:text-indigo-600 transition">Otras Medidas</a>
            <a href="plantillas.html" class="text-slate-500 hover:text-indigo-600 transition">Plantillas</a>
        </nav>
        <div class="flex items-center gap-6"><span id="user-info" class="text-sm font-medium text-slate-600"></span></div>
    </header>

    <main class="p-6 lg:p-10 max-w-2xl mx-auto w-full">
        <div class="mb-8">
            <h2 class="text-2xl font-bold" id="page-title">Nuevo Proceso con Otra Medida</h2>
            <p class="text-slate-500">Ingrese los datos básicos del proceso.</p>
        </div>

        <form id="om-form" class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nombre Estudiante</label>
                    <input type="text" id="nombre_estudiante" required class="w-full px-4 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">RUT (Opcional)</label>
                    <input type="text" id="rut" class="w-full px-4 py-2 border rounded-lg" placeholder="12.345.678-9">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Curso</label>
                <input type="text" id="curso" required class="w-full px-4 py-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Colegio</label>
                <select id="id_colegio" required class="w-full px-4 py-2 border rounded-lg"></select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Fecha Inicio</label>
                <input type="date" id="fecha_inicio" required class="w-full px-4 py-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Causa</label>
                <textarea id="causa" required rows="3" class="w-full px-4 py-2 border rounded-lg"></textarea>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Medida</label>
                <input type="text" id="medida" required placeholder="Ej: Suspensión 3 días" class="w-full px-4 py-2 border rounded-lg">
            </div>

            <div class="flex justify-end gap-3 pt-4">
                <button type="button" onclick="window.location.href='otras_medidas.html'" class="px-6 py-2 text-slate-500 font-bold">Cancelar</button>
                <button type="submit" class="px-10 py-2 bg-indigo-600 text-white font-bold rounded-lg shadow-lg">Guardar</button>
            </div>
        </form>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const omId = params.get('id');

        async function init() {
            const token = localStorage.getItem('token');
            const resp = await fetch(`${API_URL}/me`, { headers: { 'Authorization': `Bearer ${token}` }});
            const user = await resp.json();
            document.getElementById('user-info').innerText = user.nombre;
            
            await loadColegios();
            if (omId) {
                document.getElementById('page-title').innerText = 'Editar Proceso';
                loadOMData();
            }
        }

        async function loadColegios() {
            const resp = await fetch(`${API_URL}/colegios`);
            const colegios = await resp.json();
            document.getElementById('id_colegio').innerHTML = colegios.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
        }

        async function loadOMData() {
            const token = localStorage.getItem('token');
            const resp = await fetch(`${API_URL}/otras-medidas/${omId}`, { headers: { 'Authorization': `Bearer ${token}` }});
            const data = await resp.json();
            ["rut", "nombre_estudiante", "curso", "id_colegio", "fecha_inicio", "causa", "medida"].forEach(f => {
                document.getElementById(f).value = data[f] || "";
            });
        }

        document.getElementById('om-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('token');
            const payload = {
                rut: document.getElementById('rut').value,
                nombre_estudiante: document.getElementById('nombre_estudiante').value,
                curso: document.getElementById('curso').value,
                id_colegio: parseInt(document.getElementById('id_colegio').value),
                fecha_inicio: document.getElementById('fecha_inicio').value,
                causa: document.getElementById('causa').value,
                medida: document.getElementById('medida').value
            };

            const url = omId ? `${API_URL}/otras-medidas/${omId}` : `${API_URL}/otras-medidas`;
            const method = omId ? 'PUT' : 'POST';

            const resp = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(payload)
            });

            if (resp.ok) window.location.href = 'otras_medidas.html';
            else alert('Error al guardar');
        });

        init();
    </script>
</body>
</html>
