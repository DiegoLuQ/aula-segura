<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantillas de Correo - Aula Segura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { display: none; }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 font-sans">
    <script>
        const API_URL = window.location.origin.includes('127.0.0.1') || window.location.origin.includes('localhost') || window.location.origin.startsWith('file://')
            ? 'http://127.0.0.1:8000'
            : window.location.origin + '/api';

        (async function () {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = 'index.html'; return; }
            const resp = await fetch(`${API_URL}/me`, { headers: { 'Authorization': `Bearer ${token}` } });
            if (!resp.ok) { window.location.href = 'index.html'; return; }
            const user = await resp.json();
            if (user.rol !== 'lawyer' && user.rol !== 'admin') { window.location.href = 'dashboard.html'; return; }
            document.body.style.display = 'block';
        })();
    </script>

    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold text-indigo-900">Aula Segura</h1>
            <span id="user-role-badge" class="px-2 py-1 bg-indigo-100 text-indigo-700 text-xs font-bold rounded uppercase"></span>
        </div>
        <nav class="flex gap-4">
            <a href="dashboard.html" class="text-slate-500 hover:text-indigo-600 transition">Registros</a>
            <a href="otras_medidas.html" class="text-slate-500 hover:text-indigo-600 transition">Otras Medidas</a>
            <a href="plantillas.html" class="text-indigo-600 font-bold border-b-2 border-indigo-600 pb-1">Plantillas</a>
            <a href="upload.html" id="nav-upload" class="hidden text-slate-500 hover:text-indigo-600 transition">Subir Excel</a>
            <a href="admin.html" id="nav-admin" class="hidden text-slate-500 hover:text-indigo-600 transition">Usuarios</a>
        </nav>
        <div class="flex items-center gap-6">
            <span id="user-info" class="text-sm font-medium text-slate-600"></span>
            <button onclick="logout()" class="text-slate-400 hover:text-red-600 transition">Salir</button>
        </div>
    </header>

    <main class="p-6 lg:p-10 max-w-5xl mx-auto w-full">
        <div class="mb-8">
            <h2 class="text-2xl font-bold">Plantillas de Correo</h2>
            <p class="text-slate-500">Crea y administra cuerpos de correo reutilizables, organizados por fase del
                proceso. Luego podrás elegirlos al "Enviar Notificación".</p>
        </div>

        <!-- EDITOR -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
            <h3 id="editor-title" class="text-sm font-bold text-slate-700 uppercase tracking-wide mb-5">Nueva plantilla
            </h3>
            <input type="hidden" id="pl-id">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Título</label>
                    <input type="text" id="pl-titulo" placeholder='Ej. "Inicio - Formal"'
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Fase</label>
                    <select id="pl-etapa" class="w-full px-4 py-2 border rounded-lg bg-white focus:ring-2 focus:ring-indigo-500">
                        <option value="inicio_proceso">Inicio de Proceso</option>
                        <option value="medida">Medida y Apelación</option>
                        <option value="apelacion">Recepción Carta Apelación</option>
                        <option value="final_medida">Notificación Final "Medida"</option>
                    </select>
                </div>
            </div>

            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Cuerpo del Mensaje</label>
            <p class="text-[11px] text-slate-400 mb-2 flex flex-wrap gap-1.5 items-center">Haz clic para insertar:
                <button type="button" onclick="insertPlaceholder('{nombre}')" class="px-1.5 py-0.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded text-[10px]">{nombre}</button>
                <button type="button" onclick="insertPlaceholder('{rut}')" class="px-1.5 py-0.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded text-[10px]">{rut}</button>
                <button type="button" onclick="insertPlaceholder('{curso}')" class="px-1.5 py-0.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded text-[10px]">{curso}</button>
                <button type="button" onclick="insertPlaceholder('{causa}')" class="px-1.5 py-0.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded text-[10px]">{causa}</button>
                <button type="button" onclick="insertPlaceholder('{fecha_inicio}')" class="px-1.5 py-0.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded text-[10px]">{fecha_inicio}</button>
                <button type="button" onclick="insertPlaceholder('{medida}')" class="px-1.5 py-0.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded text-[10px]">{medida}</button>
                <button type="button" onclick="insertPlaceholder('{fecha_medida}')" class="px-1.5 py-0.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded text-[10px]">{fecha_medida}</button>
                <button type="button" onclick="insertPlaceholder('{colegio}')" class="px-1.5 py-0.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded text-[10px]">{colegio}</button>
            </p>
            <textarea id="pl-cuerpo" rows="7"
                class="w-full px-4 py-3 border rounded-xl text-sm text-slate-700 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                placeholder="Escribe el cuerpo del correo..."></textarea>

            <div class="flex items-center gap-3 mt-4">
                <button type="button" onclick="guardarPlantilla()" id="btn-guardar"
                    class="px-8 py-2.5 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition shadow-lg">Guardar
                    plantilla</button>
                <button type="button" onclick="resetForm()" id="btn-cancelar"
                    class="hidden px-6 py-2.5 text-slate-500 font-bold rounded-lg hover:bg-slate-100 transition">Cancelar
                    edición</button>
                <p id="pl-result" class="text-sm"></p>
            </div>
        </div>

        <!-- LISTA -->
        <div id="plantillas-list" class="space-y-8"></div>
    </main>

    <script>
        const ETAPAS = [
            { key: 'inicio_proceso', label: 'Inicio de Proceso' },
            { key: 'medida', label: 'Medida y Apelación' },
            { key: 'apelacion', label: 'Recepción Carta Apelación' },
            { key: 'final_medida', label: 'Notificación Final "Medida"' },
        ];
        const ETAPA_LABEL = Object.fromEntries(ETAPAS.map(e => [e.key, e.label]));

        let PLANTILLAS = [];

        async function init() {
            const token = localStorage.getItem('token');
            const resp = await fetch(`${API_URL}/me`, { headers: { 'Authorization': `Bearer ${token}` } });
            if (!resp.ok) { logout(); return; }
            const user = await resp.json();
            document.getElementById('user-info').innerText = user.nombre;
            document.getElementById('user-role-badge').innerText = user.rol;
            if (user.rol === 'lawyer') document.getElementById('nav-upload').classList.remove('hidden');
            if (user.rol === 'admin') document.getElementById('nav-admin').classList.remove('hidden');
            await loadPlantillas();
        }

        async function loadPlantillas() {
            const token = localStorage.getItem('token');
            const cont = document.getElementById('plantillas-list');
            try {
                const resp = await fetch(`${API_URL}/plantillas`, { headers: { 'Authorization': `Bearer ${token}` } });
                PLANTILLAS = resp.ok ? await resp.json() : [];
            } catch (e) {
                PLANTILLAS = [];
            }
            cont.innerHTML = ETAPAS.map(et => {
                const items = PLANTILLAS.filter(p => p.etapa === et.key);
                const cards = items.length
                    ? items.map(p => `
                        <div class="bg-white border border-slate-200 rounded-2xl p-4 flex flex-col gap-3 shadow-sm">
                            <div class="flex items-start justify-between gap-3">
                                <h4 class="font-bold text-slate-800">${escapeHtml(p.titulo)}</h4>
                                <div class="flex items-center gap-1.5 flex-shrink-0">
                                    <button type="button" onclick="editarPlantilla(${p.id})" class="p-2 bg-slate-50 text-slate-400 hover:bg-indigo-600 hover:text-white rounded-lg transition" title="Editar">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                    </button>
                                    <button type="button" onclick="eliminarPlantilla(${p.id})" class="p-2 bg-slate-50 text-slate-400 hover:bg-red-600 hover:text-white rounded-lg transition" title="Eliminar">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                </div>
                            </div>
                            <p class="text-xs text-slate-500 whitespace-pre-line line-clamp-4 bg-slate-50 rounded-lg p-3 border border-slate-100">${escapeHtml(p.cuerpo)}</p>
                        </div>`).join('')
                    : '<p class="text-xs text-slate-400 italic">Sin plantillas para esta fase.</p>';
                return `
                    <section>
                        <h3 class="text-sm font-bold text-indigo-700 uppercase tracking-wide mb-3">${et.label}
                            <span class="ml-1 text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full">${items.length}</span>
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${cards}</div>
                    </section>`;
            }).join('');
        }

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, c =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function insertPlaceholder(placeholder) {
            const textarea = document.getElementById('pl-cuerpo');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            textarea.value = text.substring(0, start) + placeholder + text.substring(end);
            textarea.focus();
            textarea.selectionStart = textarea.selectionEnd = start + placeholder.length;
        }

        function resetForm() {
            document.getElementById('pl-id').value = '';
            document.getElementById('pl-titulo').value = '';
            document.getElementById('pl-cuerpo').value = '';
            document.getElementById('editor-title').innerText = 'Nueva plantilla';
            document.getElementById('btn-guardar').innerText = 'Guardar plantilla';
            document.getElementById('btn-cancelar').classList.add('hidden');
            document.getElementById('pl-result').innerText = '';
        }

        function editarPlantilla(id) {
            const p = PLANTILLAS.find(x => x.id === id);
            if (!p) return;
            document.getElementById('pl-id').value = p.id;
            document.getElementById('pl-titulo').value = p.titulo;
            document.getElementById('pl-etapa').value = p.etapa;
            document.getElementById('pl-cuerpo').value = p.cuerpo;
            document.getElementById('editor-title').innerText = 'Editar plantilla';
            document.getElementById('btn-guardar').innerText = 'Actualizar plantilla';
            document.getElementById('btn-cancelar').classList.remove('hidden');
            document.getElementById('pl-result').innerText = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function guardarPlantilla() {
            const id = document.getElementById('pl-id').value;
            const titulo = document.getElementById('pl-titulo').value.trim();
            const etapa = document.getElementById('pl-etapa').value;
            const cuerpo = document.getElementById('pl-cuerpo').value.trim();
            const result = document.getElementById('pl-result');

            if (!titulo || !cuerpo) {
                result.className = 'text-sm text-red-600 font-medium';
                result.innerText = 'El título y el cuerpo son obligatorios.';
                return;
            }

            const token = localStorage.getItem('token');
            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/plantillas/${id}` : `${API_URL}/plantillas`;
            try {
                const resp = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ titulo, etapa, cuerpo })
                });
                if (resp.ok) {
                    resetForm();
                    await loadPlantillas();
                } else {
                    const err = await resp.json().catch(() => ({}));
                    result.className = 'text-sm text-red-600 font-medium';
                    result.innerText = err.detail || 'No se pudo guardar la plantilla.';
                }
            } catch (e) {
                result.className = 'text-sm text-red-600 font-medium';
                result.innerText = 'Error de conexión.';
            }
        }

        async function eliminarPlantilla(id) {
            if (!confirm('¿Eliminar esta plantilla? Esta acción no se puede deshacer.')) return;
            const token = localStorage.getItem('token');
            const resp = await fetch(`${API_URL}/plantillas/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (resp.ok) {
                if (document.getElementById('pl-id').value === String(id)) resetForm();
                loadPlantillas();
            } else {
                alert('No se pudo eliminar la plantilla.');
            }
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }

        init();
    </script>
</body>

</html>
