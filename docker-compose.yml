version: '3.8'

services:
  # --- BACKEND (FastAPI) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile # Asegúrate que este archivo exista en /backend
    container_name: ${APP_NAME:-aula-segura}-backend
    restart: always
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
    expose:
      - "8000"
    networks:
      - red_produccion

  # --- FRONTEND (Nginx) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile # Asegúrate que este archivo exista en /frontend
    container_name: ${APP_NAME:-aula-segura}-frontend
    restart: always
    environment:
      # Nginx Proxy necesita estos valores para el dominio
      - VIRTUAL_HOST=${DOMAIN}
      - LETSENCRYPT_HOST=${DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    expose:
      - "80"
    networks:
      - red_produccion
    depends_on:
      - backend

networks:
  red_produccion:
    external: true
